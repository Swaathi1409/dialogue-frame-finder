<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dialogue Frame Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --surface2: #27272a;
      --border: #3f3f46;
      --accent: #3b82f6;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      display: flex;
      flex-direction: column;
    }

    /* ─── Top Navbar ─────────────────────────────────── */
    .navbar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .brand h1 { font-size: 16px; font-weight: 700; color: #fff; }

    .search-bar {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-wrapper {
      flex: 1;
      display: flex;
      gap: 10px;
    }
    input[type="url"], input[type="text"] {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: #52525b; }

    button {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent);
      border: none; border-radius: var(--radius);
      padding: 0 20px; height: 35px;
      color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s;
      white-space: nowrap;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-reset { background: transparent; border: 1px solid var(--border); color: var(--text); display: none; }
    .btn-reset:hover { background: var(--surface2); }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Main Layout ────────────────────────────────── */
    .main-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      overflow: hidden; /* no main scroll */
    }

    /* ─── Sidebar (Progress) ─────────────────────────── */
    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
    }
    .sidebar h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    #errorBanner {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius); padding: 10px 12px; color: #fca5a5;
      font-size: 12px; display: none;
    }

    .pipeline { display: flex; flex-direction: column; gap: 4px; }
    .step {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: transparent;
      border: 1px solid transparent;
      transition: all 0.3s;
    }
    .step.active {
      background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.3);
    }
    .step-icon {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--surface2); color: var(--muted);
      display: flex; align-items: center; justify-content: center; font-size: 11px;
    }
    .step.done .step-icon { background: var(--success); color: #fff; }
    .step.active .step-icon { background: var(--accent); color: #fff; box-shadow: 0 0 0 4px rgba(59,130,246,0.2); }
    .step.error .step-icon { background: var(--danger); color: #fff; }
    
    .step-text { flex: 1; display: flex; flex-direction: column; }
    .step-title { font-size: 13px; font-weight: 600; color: var(--muted); }
    .step.active .step-title { color: var(--text); }
    .step.done .step-title { color: var(--text); }
    .step-desc { font-size: 11px; color: #71717a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

    /* ─── Result Area ────────────────────────────────── */
    .result-area {
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 20px;
      background: var(--bg);
      overflow-y: auto; /* Allow scroll only inside result area if screen is extremely small */
    }

    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--muted); font-size: 14px; gap: 12px;
    }

    .result-content {
      display: none;
      flex-direction: column;
      gap: 20px;
      height: 100%;
    }

    .frame-box {
      flex: 1;
      background: #000;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
      min-height: 0; /* allows flexbox to shrink the image container */
    }
    .frame-box img {
      max-width: 100%; max-height: 100%; object-fit: contain;
    }
    .frame-label {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 6px;
      font-size: 11px; font-family: 'JetBrains Mono', monospace; color: #fff;
    }

    .stats-panel {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      flex-shrink: 0;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px;
    }
    .stat-card label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .val { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500; color: #fff; margin-top: 4px; }
    
    .conf-high { color: var(--success) !important; }
    .conf-low { color: var(--warn) !important; }
    .conf-none { color: var(--danger) !important; }

    .details-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex-shrink: 0;
    }
    .detail-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px;
    }
    .detail-box label { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; display: block; }
    .detail-box p { font-size: 12px; color: #d4d4d8; }

  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="brand">
      <div class="logo">🎬</div>
      <h1>Dialogue Frame Finder</h1>
    </div>
    <div class="search-bar">
      <div class="input-wrapper">
        <input type="url" id="videoUrl" placeholder="Video URL (e.g. YouTube, OK.ru)" autocomplete="off" />
        <input type="text" id="dialogue" placeholder="Dialogue to search for..." autocomplete="off" />
      </div>
      <button id="analyzeBtn" onclick="startAnalysis()">
        <span class="spinner" id="btnSpinner"></span>
        <span id="btnText">Analyze</span>
      </button>
      <button id="resetBtn" class="btn-reset" onclick="reset()">Clear</button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="main-layout">
    
    <!-- Sidebar: Pipeline Progress -->
    <aside class="sidebar">
      <h2>Pipeline Status</h2>
      <div id="errorBanner"></div>
      
      <div class="pipeline">
        <div class="step" id="step-downloading">
          <div class="step-icon">1</div>
          <div class="step-text"><div class="step-title">Download</div><div class="step-desc">Waiting to start</div></div>
        </div>
        <div class="step" id="step-audio">
          <div class="step-icon">2</div>
          <div class="step-text"><div class="step-title">Audio Track</div><div class="step-desc">Waiting</div></div>
        </div>
        <div class="step" id="step-transcribing">
          <div class="step-icon">3</div>
          <div class="step-text"><div class="step-title">Transcription</div><div class="step-desc">Waiting</div></div>
        </div>
        <div class="step" id="step-locating">
          <div class="step-icon">4</div>
          <div class="step-text"><div class="step-title">Locate Dialogue</div><div class="step-desc">Waiting</div></div>
        </div>
        <div class="step" id="step-scanning">
          <div class="step-icon">5</div>
          <div class="step-text"><div class="step-title">Frame Scan</div><div class="step-desc">Waiting</div></div>
        </div>
        <div class="step" id="step-complete">
          <div class="step-icon">✓</div>
          <div class="step-text"><div class="step-title">Complete</div><div class="step-desc">Result ready</div></div>
        </div>
      </div>
    </aside>

    <!-- Result Area -->
    <main class="result-area">
      <div class="empty-state" id="emptyState">
        <span style="font-size: 32px; opacity: 0.5;">🎞️</span>
        <p>Enter a URL and dialogue in the top bar to begin.</p>
      </div>

      <div class="result-content" id="resultContent">
        <div class="frame-box">
          <img id="frameImg" style="display:none;" />
          <div class="frame-label" id="frameLabel" style="display:none;"></div>
          <span id="frameFallback" style="color: var(--muted); font-size: 13px;">Loading frame...</span>
        </div>

        <div class="stats-panel">
          <div class="stat-card">
            <label>Timestamp</label>
            <div class="val" id="resTimestamp">—</div>
          </div>
          <div class="stat-card">
            <label>Frame</label>
            <div class="val" id="resFrame">—</div>
          </div>
          <div class="stat-card">
            <label>Match Score</label>
            <div class="val" id="resScore">—</div>
          </div>
          <div class="stat-card">
            <label>Confidence</label>
            <div class="val" id="resConfidence">—</div>
          </div>
        </div>

        <div class="details-row">
          <div class="detail-box">
            <label>Extracted Text (OCR)</label>
            <p id="resText" style="font-style: italic;">—</p>
          </div>
          <div class="detail-box">
            <label>Reasoning</label>
            <p id="resReason">—</p>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script>
    let _currentSource = null;
    const STAGE_ORDER = ['downloading','metadata','audio','transcribing','locating','scanning','complete'];

    function setStage(stageId, message) {
      const idx = STAGE_ORDER.indexOf(stageId);
      if (idx === -1) return;
      
      STAGE_ORDER.forEach((s, i) => {
        const el = document.getElementById('step-' + s);
        if (!el) return;
        el.classList.remove('active','done','error');
        if (i < idx) el.classList.add('done');
        else if (i === idx) el.classList.add('active');
      });
      
      const active = document.getElementById('step-' + stageId);
      if (active && message) {
        const desc = active.querySelector('.step-desc');
        if (desc) desc.textContent = message;
      }
    }

    function startAnalysis() {
      const url = document.getElementById('videoUrl').value.trim();
      const text = document.getElementById('dialogue').value.trim();
      
      hideError();
      if (!url || !text) { showError('Please enter both a URL and dialogue.'); return; }

      // Reset UI
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active','done','error'));
      document.getElementById('analyzeBtn').disabled = true;
      document.getElementById('btnSpinner').style.display = 'block';
      document.getElementById('btnText').textContent = 'Analyzing...';
      document.getElementById('resetBtn').style.display = 'none';
      
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('resultContent').style.display = 'none';

      fetch('/api/analyze', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url, dialogue: text})
      })
      .then(r => r.json())
      .then(data => {
        if (data.error) { showError(data.error); resetBtn(); document.getElementById('emptyState').style.display = 'flex'; return; }
        subscribeToStream(data.job_id);
      })
      .catch(err => { showError(err.message); resetBtn(); document.getElementById('emptyState').style.display = 'flex'; });
    }

    function subscribeToStream(jobId) {
      if (_currentSource) _currentSource.close();
      _currentSource = new EventSource('/api/stream/' + jobId);

      _currentSource.onmessage = function(ev) {
        const evt = JSON.parse(ev.data);
        if (evt.type === 'stage') setStage(evt.stage, evt.message);
        if (evt.type === 'done') { _currentSource.close(); markAllDone(); showResult(evt.result, jobId); resetBtn(); }
        if (evt.type === 'error') { _currentSource.close(); markError(); showError(evt.message); resetBtn(); document.getElementById('emptyState').style.display = 'flex'; }
      };
      _currentSource.onerror = function() { _currentSource.close(); showError('Connection lost.'); resetBtn(); };
    }

    function markAllDone() {
      document.querySelectorAll('.step').forEach(el => { el.classList.remove('active'); el.classList.add('done'); });
    }
    function markError() {
      document.querySelectorAll('.step.active').forEach(el => { el.classList.remove('active'); el.classList.add('error'); });
    }

    function showResult(result, jobId) {
      document.getElementById('resultContent').style.display = 'flex';
      
      if (!result.found) {
        document.getElementById('resultContent').style.display = 'none';
        document.getElementById('emptyState').style.display = 'flex';
        document.getElementById('emptyState').innerHTML = `
          <span style="font-size: 32px; color: var(--warn)">⚠️</span>
          <p>Dialogue not found in video.</p>`;
        return;
      }

      document.getElementById('resTimestamp').textContent = result.timestamp || '—';
      document.getElementById('resFrame').textContent = result.frame || '—';
      document.getElementById('resScore').textContent = result.match_score ? (result.match_score + '/100') : '—';
      
      const confEl = document.getElementById('resConfidence');
      confEl.textContent = result.confidence;
      confEl.className = 'val ' + (result.confidence === 'High' ? 'conf-high' : result.confidence === 'Low' ? 'conf-low' : 'conf-none');

      document.getElementById('resText').textContent = result.text ? `"${result.text}"` : '—';
      document.getElementById('resReason').textContent = result.reasoning || '—';

      const img = document.getElementById('frameImg');
      const label = document.getElementById('frameLabel');
      const fallback = document.getElementById('frameFallback');
      
      img.style.display = 'none';
      label.style.display = 'none';
      fallback.style.display = 'block';

      if (result.has_image) {
        img.onload = () => { img.style.display = 'block'; label.style.display = 'block'; fallback.style.display = 'none'; label.textContent = 'Frame ' + result.frame; };
        img.onerror = () => { fallback.textContent = 'Image unavailable'; };
        img.src = '/api/frame/' + jobId + '?t=' + Date.now();
      } else {
        fallback.textContent = 'No frame captured';
      }
    }

    function resetBtn() {
      document.getElementById('analyzeBtn').disabled = false;
      document.getElementById('btnSpinner').style.display = 'none';
      document.getElementById('btnText').textContent = 'Analyze';
      document.getElementById('resetBtn').style.display = 'block';
    }

    function reset() {
      if (_currentSource) _currentSource.close();
      document.querySelectorAll('.step').forEach(el => { el.classList.remove('active','done','error'); el.querySelector('.step-desc').textContent = 'Waiting'; });
      hideError();
      resetBtn();
      document.getElementById('resetBtn').style.display = 'none';
      document.getElementById('resultContent').style.display = 'none';
      document.getElementById('emptyState').style.display = 'flex';
      document.getElementById('emptyState').innerHTML = `<span style="font-size: 32px; opacity: 0.5;">🎞️</span><p>Enter a URL and dialogue in the top bar to begin.</p>`;
    }

    function showError(msg) {
      const el = document.getElementById('errorBanner');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() { document.getElementById('errorBanner').style.display = 'none'; }

    ['videoUrl','dialogue'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') startAnalysis(); });
    });
  </script>
</body>
</html>
